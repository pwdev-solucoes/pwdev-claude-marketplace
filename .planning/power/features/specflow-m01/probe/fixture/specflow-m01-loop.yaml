apiVersion: compozy.loop/v1
kind: Loop
meta:
  name: specflow-m01-qualification
  description: Qualify the isolated SpecFlow M01 fixture without mutation.
  catalog:
    use_when: Qualifying the synthetic SpecFlow compatibility fixture.
    keywords: [specflow, qualification, read-only]
    category: verification
concurrency: forbid
contract:
  goal: Inspect the synthetic SpecFlow M01 fixture without changing it.
  definition_of_done: The probe reports its structural observations without mutation.
  constraints:
    - Read only the synthetic fixture.
    - Never mutate, publish, install, approve, or clean up resources.
  boundaries:
    - Stay inside the current checkout and fixture paths.
  terminal_states: [done, no-op, blocked, failed, exhausted, stalled, canceled]
  iteration_cap: 3
  no_progress: { window: 2 }
graph:
  nodes:
    - id: inspect_fixture
      class: action
      kind: run-agent
      params:
        agent: probe
        prompt: Inspect the supplied synthetic fixture and return observations only.
        max_turns: 1
  edges: []
